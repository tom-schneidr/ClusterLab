name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Dependency audit
        run: python -m pip_audit

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Smoke-test built wheel
        run: |
          wheel_venv="${RUNNER_TEMP}/clusterlab-wheel"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          CLUSTERLAB_LLM_MODE=offline-demo \
            CLUSTERLAB_DATA_DIR=clusterlab-data \
            "$wheel_venv/bin/python" -c "import sys; from pathlib import Path; from app import app; assert (Path(sys.prefix) / 'static' / 'index.html').is_file(); assert (Path('clusterlab-data') / 'clusterlab.db').is_file(); assert any(getattr(route, 'path', '') == '/static' for route in app.routes)"

      - name: Test
        run: python -m pytest

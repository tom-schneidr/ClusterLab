[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterlab"
version = "0.1.0"
description = "A local-first workbench for experimenting with cognitive agent clusters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tom Schneider" }
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pip-audit>=2.10,<3",
  "pytest>=8.0,<10",
  "ruff>=0.8,<1"
]

[project.scripts]
clusterlab = "clusterlab.cli:main"

[tool.setuptools.packages.find]
include = ["clusterlab*"]
exclude = ["tests*"]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.data-files]
"static" = ["static/index.html", "static/app.js", "static/styles.css"]
"static/js" = [
  "static/js/api.js",
  "static/js/config.js",
  "static/js/constants.js",
  "static/js/dom.js",
  "static/js/selectors.js",
  "static/js/state.js",
]
"static/js/graph" = [
  "static/js/graph/constants.js",
  "static/js/graph/execution.js",
  "static/js/graph/index.js",
  "static/js/graph/interaction.js",
  "static/js/graph/layout.js",
  "static/js/graph/ports.js",
  "static/js/graph/render.js",
  "static/js/graph/viewport.js",
]
"static/js/ui" = ["static/js/ui/hats.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
